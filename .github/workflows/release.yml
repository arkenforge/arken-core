name: Release

on:
  push:
    tags: ['v1.*']

permissions:
  contents: read

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    # Requires approval from a reviewer configured on the environment.
    environment: production
    permissions:
      contents: read
      id-token: write # npm trusted publishing and provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.x'
          registry-url: 'https://registry.npmjs.org'

      # Trusted publishing needs npm >= 11.5.1; Node 22 ships npm 10.
      - run: npm install -g npm@11.21.1

      - name: Tag matches package.json version
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"

      - run: npm ci
      - run: npm run typecheck
      - run: npm test

      # Stages the version on npm without making it public. A maintainer then publishes it
      # with 2FA: `npm stage list @arkenforge/core` and `npm stage approve <stage-id>`.
      # Authenticates with npm trusted publishing (OIDC); no token is stored anywhere.
      - run: npm stage publish --provenance --access public
